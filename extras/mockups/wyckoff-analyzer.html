      signal={e:'⏸️',t:'RE-ACCUMULATION — Next Leg Up Loading',b:`Hold longs. Do not exit into weakness. Buy dips to range support ₹${tr?.bottom.toFixed(0)} on drying volume${spring?' — Spring already confirmed, highest-conviction entry zone':'. Watch for a Spring below support as Phase C entry'}. Breakout above ₹${tr?.top.toFixed(0)} on expanding volume confirms the next markup leg.`};
    }
  } else if(phaseType==='Re-Distribution'){
    if(subPhase==='UTAD'||subPhase==='LPSY'){
      const ptrRef=ptr?`₹${ptr.bottom.toFixed(0)}–₹${ptr.top.toFixed(0)}`:'prior range';
      desc=`Price ${subPhase==='UTAD'?'broke above then returned inside':'broke below then failed to recover into'} the ${ptrRef}. This is Re-Distribution: the ${subPhase==='UTAD'?'breakout was a bull trap (UTAD)':'bounce is a Last Point of Supply (LPSY)'}. The macro context is declining (${priorInfo.r365.toFixed(0)}% trend) and the next leg should continue lower.`;
      signal={e:'🔴',t:'RE-DISTRIBUTION',b:`Short the ${subPhase==='UTAD'?'reversal from the UTAD spike':'weak LPSY bounce'}. Stop above ${subPhase==='UTAD'?`UTAD high ₹${ptr?.peakAfter?.toFixed(0)||''}`:` ₹${ptr?.top?.toFixed(0)||''}`}. Target: prior lows and below.`};
    } else {
      desc=`Price is pausing in a ${trDesc} range mid-downtrend (prior trend: ${priorInfo.r365.toFixed(0)}% over the past year). This is Re-Distribution — a pause in the downtrend where remaining demand is being exhausted before the next markdown leg. ${upthrust?'An Upthrust has confirmed Phase C — supply has overwhelmed demand.':''} Supply is ${volBias==='bearish'?'dominant (bearish volume bias)':'building'}.`;
      signal={e:'⏸️',t:'RE-DISTRIBUTION — Next Leg Down Loading',b:`Short rallies to range resistance ₹${tr?.top.toFixed(0)} on drying volume${upthrust?' — Upthrust already confirmed, highest-conviction short entry':'. Watch for an Upthrust above resistance as Phase C entry'}. Breakdown below ₹${tr?.bottom.toFixed(0)} on expanding volume confirms the next markdown leg.`};
    }
  } else if(phaseType==='Markup'){
    desc=`Price is in a confirmed uptrend: higher highs and higher lows (prior trend: +${priorInfo.r365.toFixed(0)}% over the past year). No active trading range detected — demand is dominant and price is being marked up. ${volBias==='bullish'?'Volume confirms: more intensity on up-swings than down-swings.':''}`;
    signal={e:'🚀',t:'MARKUP — Uptrend in Progress',b:`Stay long. Trail stops below swing lows. Look for Re-Accumulation ranges (stepping stones) as add-to-long opportunities. A significant range forming after a large advance may indicate Distribution — watch for climactic volume at highs.`};
  } else if(phaseType==='Markdown'){
    desc=`Price is in a confirmed downtrend: lower highs and lower lows (prior trend: ${priorInfo.r365.toFixed(0)}% over the past year). No active trading range detected — supply is dominant and price is being marked down. ${volBias==='bearish'?'Volume confirms: more intensity on down-swings than up-swings.':''}`;
    signal={e:'📉',t:'MARKDOWN — Downtrend in Progress',b:`Avoid longs. Short rallies that fail at lower highs. Look for Re-Distribution ranges (stepping stones lower) as add-to-short opportunities. A climactic wide bar on extreme volume at lows may signal an approaching Selling Climax and Accumulation base.`};
  } else {
    desc='Insufficient trend clarity. Price action is mixed with no confirmed range or trend. Wait for either a clear TR (range) or a decisive HH+HL / LH+LL structure before committing.';
    signal={e:'⚖️',t:'TRANSITIONAL — Wait for Clarity',b:'Reduce size to minimum. Do not force a direction. Watch for a clear Selling Climax or Buying Climax to define the next phase, or a breakout/breakdown from the current choppy zone.'};
  }

  // ── 10. EVENTS PANEL ─────────────────────────────────────────────────────
  if(inRange){
    const isAccum=phaseType==='Accumulation'||phaseType==='Re-Accumulation';
    const isDist =phaseType==='Distribution'||phaseType==='Re-Distribution';
    events=[
      {tag:'RANGE', label:'Trading Range',    ok:true,         desc:`${trDesc} | Price at ${posInTRpct} of range`},
      {tag:'PRIOR', label:'Prior Trend',       ok:true,         desc:`r126=${priorInfo.r126.toFixed(0)}% r365=${priorInfo.r365.toFixed(0)}% → ${priorDir}`},
      ...(isAccum?[
        {tag:'PS',    label:'Preliminary Support', ok:ps.detected,  desc:ps.detected?`PS bar: ${ps.bar?.date}`:'Watching for first demand bar after decline'},
        {tag:'SC',    label:'Selling Climax',      ok:sc.detected,  desc:sc.detected?`SC: ${sc.bar?.date} — panic selling absorbed`:'Watching for high-vol wide-spread down bar closing upper half'},
        {tag:'ST',    label:'Secondary Test',      ok:st.detected,  desc:st.detected?`ST: ${st.bar?.date} — lower vol re-test`:'Lower-vol retest of SC area needed'},
        {tag:'SPRING',label:'Spring / Shakeout',   ok:spring,       desc:spring?'Spring confirmed — bear trap, Phase C':'Watch for dip below range bottom that quickly recovers'},
        {tag:'SOS',   label:'Sign of Strength',    ok:spring&&volBias==='bullish', desc:spring?`Vol bias: ${volBias}`:'Wide advance on high vol after Spring'},
        {tag:'VOL',   label:'Volume Drying',       ok:volDrying,    desc:volDrying?'Volume contracting — absorption in progress':'Monitor for volume contraction on downswings'},
      ]:[]),
      ...(isDist?[
        {tag:'PSY',  label:'Preliminary Supply',   ok:psy.detected, desc:psy.detected?`PSY bar: ${psy.bar?.date}`:'Watching for first supply bar after advance'},
        {tag:'BC',   label:'Buying Climax',        ok:bc.detected,  desc:bc.detected?`BC: ${bc.bar?.date} — public buying absorbed`:'Watching for high-vol wide-spread up bar closing lower half'},
        {tag:'SOW',  label:'Sign of Weakness',     ok:sow.detected, desc:sow.detected?`SOW: ${sow.bar?.date} — supply dominant`:'Wide-spread high-vol down bar closing near low'},
        {tag:'UT',   label:'Upthrust / UTAD',      ok:upthrust,     desc:upthrust?'Upthrust confirmed — bull trap, Phase C':'Watch for spike above range top that reverses'},
        {tag:'LPSY', label:'Last Point of Supply', ok:subPhase==='Phase D', desc:'Feeble low-volume rally — ideal short entry'},
        {tag:'VOL',  label:'Vol on Down-Moves',    ok:volBias==='bearish', desc:`Swing vol bias: ${volBias}`},
      ]:[]),
    ];
  } else if(ptr){
    events=[
      {tag:'PTR',   label:'Prior Range',        ok:true,         desc:`₹${ptr.bottom.toFixed(0)}–₹${ptr.top.toFixed(0)}`},
      {tag:'BREAK', label:ptr.brokeUp?'Breakout (UTAD/SOS)':'Breakdown (Spring/LPSY)', ok:true, desc:`${ptr.brokeUp?'Above':'Below'} ₹${ptr.brokeUp?ptr.top.toFixed(0):ptr.bottom.toFixed(0)}, returned ${ptr.returnPct?.toFixed(1)}%`},
      {tag:'POS',   label:'Position in Range',  ok:ptr?((bars[n-1].close-ptr.bottom)/(ptr.top-ptr.bottom))>0:false, desc:`posInRange=${((bars[n-1].close-ptr.bottom)/(ptr.top-ptr.bottom)).toFixed(2)}`},
      {tag:'VOL',   label:'Volume Bias',        ok:volBias!=='neutral', desc:`${volBias}`},
      {tag:'PRIOR', label:'Prior Trend',        ok:true,         desc:`r126=${priorInfo.r126.toFixed(0)}% r365=${priorInfo.r365.toFixed(0)}% → ${priorDir}`},
    ];
  } else if(localBO){
    events=[
      {tag:'RANGE', label:'Micro Range',        ok:true,         desc:`₹${localBO.bottom.toFixed(0)}–₹${localBO.top.toFixed(0)} (${localBO.width}% wide)`},
      {tag:'SOS',   label:'SOS Breakout',       ok:true,         desc:`${localBO.volRatio.toFixed(1)}× avg volume on breakout`},
      {tag:'PRIOR', label:'Prior Trend',        ok:true,         desc:`r365=${priorInfo.r365.toFixed(0)}% — uptrend`},
      {tag:'VOL',   label:'Volume Bias',        ok:volBias==='bullish', desc:`${volBias}`},
    ];
  } else {
    events=[
      {tag:'STR',   label:'Structure',          ok:phaseType!=='Transitional', desc:`${phaseType} (r126=${priorInfo.r126.toFixed(0)}% r365=${priorInfo.r365.toFixed(0)}%)`},
      {tag:'VOL',   label:'Volume Bias',        ok:volBias!=='neutral', desc:`${volBias}`},
      {tag:'PRIOR', label:'Prior Trend',        ok:priorDir!=='sideways', desc:`${priorDir} | r126=${priorInfo.r126.toFixed(0)}% r365=${priorInfo.r365.toFixed(0)}%`},
    ];
  }

  // ── 11. RETURN OBJECT (all fields the UI expects) ─────────────────────────
  const priceChg  =((lastClose-bars[0].close)/bars[0].close)*100;
  const avgVol10  =bars.slice(-10).reduce((s,b)=>s+b.volume,0)/10;
  const avgVolAll =bars.reduce((s,b)=>s+b.volume,0)/n;
  const volRatio  =avgVolAll>0?avgVol10/avgVolAll:1;

  // 2-year swing context (used by UI)
  const bars2yr   =bars.slice(Math.max(0,n-504));
  const high2yr   =Math.max(...bars2yr.map(b=>b.high));
  const low2yr    =Math.min(...bars2yr.map(b=>b.low));
  const range2yr  =high2yr-low2yr||1;
  const posIn2yrRange=(lastClose-low2yr)/range2yr;
  const nearSwingHigh2yr=lastClose>=high2yr*0.97;
  const nearSwingLow2yr =lastClose<=low2yr *1.03;

  // SMA20
  const sma20=bars.length>=20
    ? bars.slice(-20).reduce((s,b)=>s+b.close,0)/20
    : bars.reduce((s,b)=>s+b.close,0)/bars.length;

  return {
    // Classification
    phaseType, subPhase, conf, desc, signal, events,

    // Range
    tr, ptr, localBO, spring, upthrust,

    // Zigzag (for chart rendering)
    zz,

    // Structure (kept for UI compatibility)
    structure:  priorDir==='up'?'uptrend':priorDir==='down'?'downtrend':'transitional',
    priorStructure: priorDir,
    priorPctChg: priorInfo.r126,

    // Detection events
    sc, bc, ps, psy, st, sow,
    volBias, volDrying,

    // Price context
    lastClose, maxHigh:allTimeHigh, minLow:allTimeLow,
    pricePos, priceChg, volRatio, sma20,

    // 2-year range context
    posIn2yrRange, nearSwingHigh2yr, nearSwingLow2yr,

    // Legacy compat fields
    priorWasUp:   priorDir==='up',
    priorWasDown: priorDir==='down',
    correctionInUptrend: priorDir==='up' && priorInfo.r126<-8,
    failedBreakout:false, expandedRange:false,
  };
}

function _emptyResult(bars){
  return {
    phaseType:'Accumulation',subPhase:'Insufficient Data',conf:0,
    desc:'Not enough data.',signal:{e:'⚖️',t:'INSUFFICIENT DATA',b:'Need at least 10 bars.'},
    events:[],tr:null,ptr:null,localBO:null,spring:false,upthrust:false,
    zz:[],structure:'insufficient',priorStructure:'insufficient',priorPctChg:0,
    sc:{detected:false},bc:{detected:false},ps:{detected:false},psy:{detected:false},
    st:{detected:false},sow:{detected:false},
    volBias:'neutral',volDrying:false,
    lastClose:bars[bars.length-1]?.close??0,maxHigh:0,minLow:0,
    pricePos:0.5,priceChg:0,volRatio:1,sma20:0,
    posIn2yrRange:0.5,nearSwingHigh2yr:false,nearSwingLow2yr:false,
    priorWasUp:false,priorWasDown:false,correctionInUptrend:false,
    failedBreakout:false,expandedRange:false,
  };
}


function phaseColor(pt){
  return {'Markup':'#00e396','Re-Accumulation':'#00d4ff','Accumulation':'#a78bfa',
          'Distribution':'#ff6b35','Re-Distribution':'#ffd166','Markdown':'#ff4560'}[pt]||'#00d4ff';
}
function phaseAccentCls(pt){
  return {'Markup':'bg','Re-Accumulation':'bl','Accumulation':'bl',
          'Distribution':'bo','Re-Distribution':'by','Markdown':'br'}[pt]||'bl';
}

function renderResults(r, bars){

  // Build multi-range string for display

  const zzStr = `${r.zz.length} pivots`;

  document.getElementById('out').innerHTML=`

      <div class="pname" style="font-size:18px;margin-bottom:12px">${r.signal.t}</div>
      <div class="pdesc">${r.signal.b}</div>
    </div>
  </div>

  <div class="metrics">
    <div class="mcard"><div class="mlbl">Last Close</div><div class="mval">₹${r.lastClose.toFixed(2)}</div><div class="msub ${pClr}">${r.priceChg>=0?'+':''}${r.priceChg.toFixed(1)}% overall</div></div>
    <div class="mcard"><div class="mlbl">Swing Structure</div><div class="mval ${strClr}" style="font-size:17px">${strLabel}</div><div class="msub">${zzStr} · ${priorStr}</div></div>
    <div class="mcard"><div class="mlbl">Trading Range</div><div class="mval neu" style="font-size:15px">${trStr}</div><div class="msub">${r.tr?r.tr.width+'% width':'no active range'}</div></div>
    <div class="mcard"><div class="mlbl">Volume Bias</div><div class="mval ${r.volBias==='bullish'?'pos':r.volBias==='bearish'?'neg':'neu'}" style="font-size:17px">${r.volBias==='bullish'?'↑ Bullish':r.volBias==='bearish'?'↓ Bearish':'→ Neutral'}</div><div class="msub">swing vol · ratio ${r.volRatio.toFixed(2)}x</div></div>
    <div class="mcard"><div class="mlbl">Key Events</div><div class="mval" style="font-size:14px">${r.sc.detected?'SC ✓':r.bc.detected?'BC ✓':'—'} ${r.spring?'· Spring ✓':''} ${r.upthrust?'· UT ✓':''}</div><div class="msub">detected events</div></div>
  </div>

  <div class="schembox">
    <div class="sec-title">Wyckoff Market Cycle — Current Position</div>
    <div class="timeline">
      ${CYCLE.map((p,i)=>`
        <div class="tstep${p===r.phaseType?' on':''}${p===r.phaseType&&(p==='Markdown'||p==='Distribution'||p==='Re-Distribution')?' d':''}">
          <div class="tslbl" style="font-size:10px;white-space:nowrap">${p}</div>
          <div class="tsname">${CYCLE_DESC[i]}</div>
        </div>`).join('')}
    </div>
    <div class="schemsub">Accum → Markup → Re-Acc → (back to Markup) → Distribution → Markdown → Re-Dist → (back to Markdown) → next Accum</div>
  </div>

  <div class="chart-box">
    <div class="ctitle">Daily Candlestick Chart — Last 3 Years</div>
    <div class="csub">OHLC · 20-day SMA · drag to pan · scroll to move &nbsp;|&nbsp; Pivot dots: <span style="color:#00e396">●HH/HL</span> <span style="color:#ff4560">●LH/LL</span> <span style="color:#aaa">●EH/EL</span> <span style="color:#00d4ff">●SC</span> <span style="color:#ff6b35">●BC</span> <span style="color:#a78bfa">●Spring</span> <span style="color:#ffd166">●UT</span></div>
    <div class="chart-wrap"><canvas id="pc"></canvas><div class="tooltip" id="pcTip"></div></div>

  <div class="evgrid">
    <div class="evcard">
      <div class="sec-title">Wyckoff Event Detection</div>
      <ul class="evlist">
        ${r.events.map(e=>`<li>
          <span class="etag ${e.ok?'ok':'no'}">${e.tag}</span>
          <div class="etxt"><strong style="color:var(--text)">${e.label}</strong><br>${e.desc}</div>
        </li>`).join('')}
      </ul>
    </div>
    <div class="evcard">
      <div class="sec-title">Zigzag Engine Evidence</div>
      <ul class="evlist">
        <li><span class="etag info">ZZ</span><div class="etxt">Zigzag pivots: <strong style="color:var(--text)">${r.zz.length}</strong> detected (ATR-based dynamic threshold)</div></li>
        <li><span class="etag info">STR</span><div class="etxt">Current structure: <strong style="color:var(--text)">${strLabel}</strong> · Prior 6M: <strong style="color:var(--text)">${r.priorStructure} (${r.priorPctChg>=0?'+':''}${r.priorPctChg.toFixed(1)}%)</strong></div></li>
        <li><span class="etag info">TR</span><div class="etxt">Active trading range: <strong style="color:var(--text)">${r.tr?`₹${r.tr.bottom.toFixed(1)}–₹${r.tr.top.toFixed(1)} (${r.tr.width}% wide)`:'No active range detected'}</strong></div></li>
        ${r.ptr ? `<li><span class="etag ${r.ptr.brokeUp?'no':'ok'}">${r.ptr.brokeUp?'UTAD':'SPR'}</span><div class="etxt">
          Prior TR: <strong style="color:var(--text)">₹${r.ptr.bottom.toFixed(0)}–₹${r.ptr.top.toFixed(0)}</strong>
          · ${r.ptr.brokeUp?`Broke up to ₹${r.ptr.peakAfter.toFixed(0)}`:`Broke down to ₹${r.ptr.troughAfter.toFixed(0)}`}
          · returned inside → <strong style="color:${r.ptr.brokeUp?'var(--red)':'var(--green)'}">${r.ptr.brokeUp?'Old top = resistance':'Old bottom = support'}</strong>
        </div></li>` : ''}
        <li><span class="etag info">LOC</span><div class="etxt">
          2-year swing position: <strong style="color:${r.nearSwingHigh2yr?'var(--green)':r.nearSwingLow2yr?'var(--red)':'var(--gold)'}">${(r.posIn2yrRange*100).toFixed(0)}% of 2yr range</strong>
          &nbsp;·&nbsp;
          <strong style="color:${r.nearSwingHigh2yr?'var(--green)':r.nearSwingLow2yr?'var(--red)':'var(--muted)'}">${r.nearSwingHigh2yr?'Near swing highs':r.nearSwingLow2yr?'Near swing lows':'Mid-range'}</strong>
          ${r.correctionInUptrend?'<span style="color:var(--accent);font-size:10px"> ← correction in uptrend detected</span>':''}
        </div></li>
        <li><span class="etag info">VOL</span><div class="etxt">Swing volume bias: <strong style="color:var(--text)">${r.volBias}</strong> · ${r.volDrying?'Volume drying up inside range':'Volume normal'}</div></li>
        <li><span class="etag info">SC/BC</span><div class="etxt">
          SC: <strong style="color:${r.sc.detected?'var(--green)':'var(--muted)'}">${r.sc.detected?'✓ Detected':'✗ None'}</strong> &nbsp;
          BC: <strong style="color:${r.bc.detected?'var(--red)':'var(--muted)'}">${r.bc.detected?'✓ Detected':'✗ None'}</strong>
        </div></li>
        <li><span class="etag info">EVTS</span><div class="etxt">
          Spring: <strong style="color:${r.spring?'var(--green)':'var(--muted)'}">${r.spring?'✓':'✗'}</strong> &nbsp;
          Upthrust: <strong style="color:${r.upthrust?'var(--red)':'var(--muted)'}">${r.upthrust?'✓':'✗'}</strong> &nbsp;
          Vol Drying: <strong style="color:${r.volDrying?'var(--gold)':'var(--muted)'}">${r.volDrying?'✓':'✗'}</strong>
        </div></li>
      </ul>
    </div>
  </div>`;

  setTimeout(()=>{const el=document.getElementById('cfill');if(el)el.style.width=r.conf+'%';},100);
  renderCharts(bars, r);
}

// ── HELPERS ───────────────────────────────────────────────
function parseToISO(d){const p=d.split('/');return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:d;}
function filterLast3Years(bars){
  const cutoff=new Date(parseToISO(bars[bars.length-1].date));
  cutoff.setFullYear(cutoff.getFullYear()-3);
  return bars.filter(b=>new Date(parseToISO(b.date))>=cutoff);
}
function calcSMA(bars,p){return bars.map((_,i)=>i<p-1?null:bars.slice(i-p+1,i+1).reduce((s,b)=>s+b.close,0)/p);}
function fmtVol(v){if(v>=1e7)return(v/1e7).toFixed(1)+'Cr';if(v>=1e5)return(v/1e5).toFixed(1)+'L';return v.toLocaleString();}
function fmtPrice(v){return'₹'+v.toFixed(2);}

// ── CANVAS CHART STATE ────────────────────────────────────
const CS={bars:[],sma:[],offset:0,cw:8,gap:1,dragging:false,dragX:0,dragOff:0,resizeBound:false};
const PAD={L:70,R:16,T:24,B:36};

function drawCharts(){
  const pcEl=document.getElementById('pc');
  const vcEl=document.getElementById('vc');
  if(!pcEl||!vcEl) return;
  const W=pcEl.width, bars=CS.bars, sma=CS.sma, cw=CS.cw, gap=CS.gap;
  const slot=cw+gap;   // pixel width of one candle slot (cw=body, gap=space between)
  const n=bars.length;
  const drawW=W-PAD.L-PAD.R;
  const visCount=Math.max(1,Math.floor(drawW/slot));
  const startIdx=Math.max(0,Math.min(CS.offset,n-visCount));
  const endIdx=Math.min(n,startIdx+visCount+1);
  const vis=bars.slice(startIdx,endIdx);

  // ── PRICE CANVAS ─────────────────────────────────────────
  const pH=pcEl.height-PAD.T-PAD.B;
  const pc=pcEl.getContext('2d');
  pc.clearRect(0,0,W,pcEl.height);

  // price range with padding
  let lo=Infinity,hi=-Infinity;
  vis.forEach(b=>{lo=Math.min(lo,b.low);hi=Math.max(hi,b.high);});
  // also include SMA in range
  vis.forEach((_,i)=>{const sv=sma[startIdx+i];if(sv){lo=Math.min(lo,sv);hi=Math.max(hi,sv);}});
  const pad=(hi-lo)*0.06; lo-=pad; hi+=pad;
  const toY=p=>PAD.T+(hi-p)/(hi-lo)*pH;

  // Horizontal grid + price labels
  const steps=6;
  for(let i=0;i<=steps;i++){
    const p=lo+(hi-lo)*(i/steps);
    const y=toY(p);
    pc.strokeStyle='rgba(30,45,71,0.55)';pc.lineWidth=1;
    pc.beginPath();pc.moveTo(PAD.L,y);pc.lineTo(W-PAD.R,y);pc.stroke();
    pc.fillStyle='#4a5e7a';pc.font='9px Space Mono';pc.textAlign='right';
    pc.fillText(p.toFixed(1),PAD.L-4,y+3);
  }

  // Vertical grid + month labels
  let lastLbl='';
  vis.forEach((b,i)=>{
    const cx=PAD.L+i*(slot)+cw/2;
    const d=new Date(parseToISO(b.date));
    const lbl=d.toLocaleString('default',{month:'short'})+' '+d.getFullYear().toString().slice(2);
    if(lbl!==lastLbl){
      lastLbl=lbl;
      pc.strokeStyle='rgba(30,45,71,0.4)';pc.lineWidth=1;
      pc.beginPath();pc.moveTo(cx,PAD.T);pc.lineTo(cx,pcEl.height-PAD.B);pc.stroke();
      pc.fillStyle='#4a5e7a';pc.font='9px Space Mono';pc.textAlign='center';
      pc.fillText(lbl,cx,pcEl.height-PAD.B+14);
    }
  });

  // SMA line
  pc.beginPath();pc.strokeStyle='#ffd166';pc.lineWidth=1.5;pc.setLineDash([5,3]);
  let sm=false;
  vis.forEach((_,i)=>{
    const sv=sma[startIdx+i];if(sv===null)return;
    const x=PAD.L+i*(slot)+cw/2,y=toY(sv);
    sm?(pc.lineTo(x,y)):(pc.moveTo(x,y),sm=true);
  });
  pc.stroke();pc.setLineDash([]);

  // ── TRADING RANGE LINES ───────────────────────────────────
  const res=CS.result;
  if(res && res.tr){
    const isAccum=res.phaseType==='Accumulation'||res.phaseType==='Re-Accumulation';
    // Colour palette — bullish = cyan family, bearish = orange/red family
    const hue = isAccum ? '185' : '22';  // cyan vs orange in HSL

    // Collect all unique levels across all ranges to draw
    // Each range = { top, bottom, mid, label, isPrimary, lb }
    const allR = res.tr.allRanges || [{
      top:res.tr.top, bottom:res.tr.bottom, mid:res.tr.mid,
      label:'', isPrimary:true, lb:res.tr.lookback
    }];

    // Deduplicate levels: only draw a line if it is at least 2px different from
    // an already-drawn line (avoids overlapping labels when multiple windows find
    // the same zone at the same price)
    const drawnY = [];
    function isFresh(y){ return drawnY.every(dy=>Math.abs(dy-y)>8); }

    // ── Draw widest (macro) range first as a subtle filled band ──────────────
    const macroR = [...allR].sort((a,b)=>parseFloat(b.width)-parseFloat(a.width))[0];
    const macroTop=toY(macroR.top), macroBot=toY(macroR.bottom);
    pc.fillStyle=`hsla(${hue},90%,60%,0.04)`;
    pc.fillRect(PAD.L, macroTop, W-PAD.L-PAD.R, macroBot-macroTop);

    // ── Draw each range's lines, widest first (so primary draws on top) ──────
    const sorted=[...allR].sort((a,b)=>parseFloat(b.width)-parseFloat(a.width));

    sorted.forEach((r,i)=>{
      const isPrimary=r.isPrimary;
      const rTop=toY(r.top), rBot=toY(r.bottom);

      // Visual style scales with importance:
      // Primary = solid bright line 1.5px
      // Secondary, wider  = dashed slightly dimmer
      // Secondary, narrower = dotted, dimmer still
      const alpha = isPrimary ? 0.75 : (parseFloat(r.width)>10 ? 0.45 : 0.35);
      const color = `hsla(${hue},90%,65%,${alpha})`;
      const lw    = isPrimary ? 1.5 : 1;
      const dash  = isPrimary ? [6,3] : parseFloat(r.width)>10 ? [8,4] : [3,5];

      pc.setLineDash(dash);
      pc.lineWidth=lw;
      pc.strokeStyle=color;

      // Resistance line
      if(isFresh(rTop)){
        pc.beginPath();pc.moveTo(PAD.L,rTop);pc.lineTo(W-PAD.R,rTop);pc.stroke();
        drawnY.push(rTop);
      }
      // Support line
      if(isFresh(rBot)){
        pc.beginPath();pc.moveTo(PAD.L,rBot);pc.lineTo(W-PAD.R,rBot);pc.stroke();
        drawnY.push(rBot);
      }
      pc.setLineDash([]);

      // Labels — primary on LEFT, secondaries on RIGHT staggered by i
      pc.font = isPrimary ? 'bold 9px Space Mono' : '8px Space Mono';
      pc.fillStyle=color;
      const prefix = r.label ? r.label+' ' : '';
      if(isPrimary){
        pc.textAlign='left';
        if(isFresh(rTop-10)||i===0) pc.fillText(prefix+'R ₹'+r.top, PAD.L+2, rTop-4);
        if(isFresh(rBot+14)||i===0) pc.fillText(prefix+'S ₹'+r.bottom, PAD.L+2, rBot+12);
      } else {
        // Stack secondary labels on right side, offset vertically to avoid overlap
        const yOffset = i * 1;  // slight stagger
        pc.textAlign='right';
        if(isFresh(rTop-10+yOffset)) pc.fillText(prefix+'R ₹'+r.top, W-PAD.R-2, rTop-4+yOffset);
        if(isFresh(rBot+14+yOffset)) pc.fillText(prefix+'S ₹'+r.bottom, W-PAD.R-2, rBot+12+yOffset);
      }
    });

    // ── Mid line of primary range ────────────────────────────────────────────
    const trMid=toY(res.tr.mid);
    pc.setLineDash([2,6]);
    pc.lineWidth=0.8;
    pc.strokeStyle=`hsla(${hue},70%,65%,0.18)`;
    pc.beginPath();pc.moveTo(PAD.L,trMid);pc.lineTo(W-PAD.R,trMid);pc.stroke();
    pc.setLineDash([]);
  }

  // ── PRIOR TRADING RANGE (UTAD / Spring reference) ─────────
  // Drawn as a softer dashed band with [·····] style to distinguish from active TR
  if(res && res.ptr){
    const ptrTop = toY(res.ptr.top);
    const ptrBot = toY(res.ptr.bottom);
    // Colour: red-tint for UTAD (brokeUp = Re-Dist), blue-tint for Spring (Re-Acc)
    const ptrColor = res.ptr.brokeUp
      ? 'rgba(255,69,96,0.55)'       // Re-Distribution — UTAD
      : 'rgba(0,212,255,0.55)';      // Re-Accumulation — Spring
    const ptrFill  = res.ptr.brokeUp
      ? 'rgba(255,69,96,0.06)'
      : 'rgba(0,212,255,0.06)';

    // Fill band
    pc.fillStyle = ptrFill;
    pc.fillRect(PAD.L, ptrTop, W - PAD.L - PAD.R, ptrBot - ptrTop);

    // Top & bottom lines — long dash + dot pattern
    pc.setLineDash([8, 3, 2, 3]);
    pc.lineWidth = 1.5;
    pc.strokeStyle = ptrColor;
    pc.beginPath(); pc.moveTo(PAD.L, ptrTop); pc.lineTo(W - PAD.R, ptrTop); pc.stroke();
    pc.beginPath(); pc.moveTo(PAD.L, ptrBot); pc.lineTo(W - PAD.R, ptrBot); pc.stroke();
    pc.setLineDash([]);

    // UTAD / Spring peak marker — small horizontal tick where breakout peaked/troughed
    const peakPrice  = res.ptr.brokeUp ? res.ptr.peakAfter   : null;
    const troughPrice= res.ptr.brokeUp ? null                : res.ptr.troughAfter;
    const extremePrice = peakPrice || troughPrice;
    if(extremePrice && extremePrice > lo && extremePrice < hi){
      const ey = toY(extremePrice);
      pc.strokeStyle = res.ptr.brokeUp ? 'rgba(255,69,96,0.7)' : 'rgba(0,212,255,0.7)';
      pc.setLineDash([3,4]);
      pc.lineWidth = 1;
      pc.beginPath(); pc.moveTo(PAD.L, ey); pc.lineTo(W - PAD.R, ey); pc.stroke();
      pc.setLineDash([]);
      pc.fillStyle   = res.ptr.brokeUp ? '#ff4560' : '#00d4ff';
      pc.font = 'bold 9px Space Mono'; pc.textAlign = 'right';
      pc.fillText((res.ptr.brokeUp ? 'UTAD ₹' : 'SPR ₹') + extremePrice.toFixed(0), W - PAD.R - 2, ey - 3);
    }

    // Labels on the left
    pc.fillStyle = ptrColor; pc.font = 'bold 9px Space Mono'; pc.textAlign = 'left';
    pc.fillText('pR ₹' + res.ptr.top.toFixed(0),    PAD.L + 2, ptrTop - 4);
    pc.fillText('pS ₹' + res.ptr.bottom.toFixed(0), PAD.L + 2, ptrBot + 12);
  }

  // ── ZIGZAG PIVOT DOTS ─────────────────────────────────────
  // Each dot shows: price, HH/LH/HL/LL label, swing % from prior pivot,
  // and special event tags (SC, BC, Spring, UT)
  vis.forEach((b,i)=>{
    const x=PAD.L+i*(slot), cx=x+cw/2;
    const isUp=b.close>=b.open;
    const upC='rgba(0,227,150,0.9)',dnC='rgba(255,69,96,0.9)';
    const col=isUp?upC:dnC;
    const bodyT=toY(Math.max(b.open,b.close)),bodyB=toY(Math.min(b.open,b.close));
    const bodyH=Math.max(1,bodyB-bodyT);
    // wick
    pc.strokeStyle=col;pc.lineWidth=1;
    pc.beginPath();pc.moveTo(cx,toY(b.high));pc.lineTo(cx,toY(b.low));pc.stroke();
    // body
    if(cw>=3){
      pc.fillStyle=col;pc.fillRect(x,bodyT,cw,bodyH);
      pc.strokeStyle=isUp?'#00e396':'#ff4560';pc.lineWidth=0.5;pc.strokeRect(x,bodyT,cw,bodyH);
    } else {
      pc.fillStyle=col;pc.fillRect(cx,bodyT,1,bodyH);
    }
  });

  if(res && res.zz && res.zz.length){
    const zz = res.zz;

    // Pre-compute structure labels for every pivot
    // Compare each high to the prior high, each low to the prior low
    const prevHighs = {}, prevLows = {};
    let lastH = null, lastL = null;
    const structLabel = {};
    zz.forEach((p,i) => {
      if(p.type === 'high'){
        if(lastH !== null){
          const chg = (p.price - lastH) / lastH * 100;
          if(chg >  1.5) structLabel[i] = 'HH';
          else if(chg < -1.5) structLabel[i] = 'LH';
          else             structLabel[i] = 'EH';
        } else { structLabel[i] = ''; }
        lastH = p.price;
      } else {
        if(lastL !== null){
          const chg = (p.price - lastL) / lastL * 100;
          if(chg >  1.5) structLabel[i] = 'HL';
          else if(chg < -1.5) structLabel[i] = 'LL';
          else             structLabel[i] = 'EL';
        } else { structLabel[i] = ''; }
        lastL = p.price;
      }
    });

    // Special event override labels
    const eventLabel = {};
    const scIdx  = res.sc?.detected  ? res.sc.idx  : -1;
    const bcIdx  = res.bc?.detected  ? res.bc.idx  : -1;
    // Spring: last low pivot that dipped below TR bottom
    if(res.spring && res.tr){
      const springPiv = [...zz].reverse().find(p => p.type==='low' && p.price < res.tr.bottom * 1.01);
      if(springPiv) eventLabel[zz.indexOf(springPiv)] = 'SPR';
    }
    // Upthrust: last high pivot that spiked above TR top
    if(res.upthrust && res.tr){
      const utPiv = [...zz].reverse().find(p => p.type==='high' && p.price > res.tr.top * 0.99);
      if(utPiv) eventLabel[zz.indexOf(utPiv)] = 'UT';
    }
    // SC / BC — find nearest pivot to those bar indices
    if(scIdx >= 0){
      let best = -1, bestDist = Infinity;
      zz.forEach((p,i) => { const d = Math.abs(p.index - scIdx); if(p.type==='low' && d < bestDist){ bestDist=d; best=i; }});
      if(best >= 0) eventLabel[best] = 'SC';
    }
    if(bcIdx >= 0){
      let best = -1, bestDist = Infinity;
      zz.forEach((p,i) => { const d = Math.abs(p.index - bcIdx); if(p.type==='high' && d < bestDist){ bestDist=d; best=i; }});
      if(best >= 0) eventLabel[best] = 'BC';
    }

    zz.forEach((piv, i) => {
      const vi = piv.index - startIdx;
      if(vi < 0 || vi >= vis.length) return;

      const cx   = PAD.L + vi*(slot) + cw/2;
      // Plot the dot at bar.close (inside the candle body) rather than at the
      // wick extreme (bar.high / bar.low). When the chart range is large and
      // candles are compressed to a few pixels, wick-positioned dots float
      // visually below or above the candle body. Close-positioned dots always
      // sit on the candle regardless of zoom level.
      const dotBar = vis[vi];
      const py   = dotBar ? toY(dotBar.close) : toY(piv.price);
      const isH  = piv.type === 'high';
      const sLbl = structLabel[i] || '';
      const eLbl = eventLabel[i]  || '';

      // Swing % from prior pivot
      const prev = zz[i-1];
      const swingPct = prev ? Math.abs((piv.price - prev.price) / prev.price * 100).toFixed(1) : null;

      // Colour: special events get distinct colours, otherwise HH/HL=bullish, LH/LL=bearish
      let dotColor;
      if(eLbl === 'SC')   dotColor = '#00d4ff';   // cyan — climax low
      else if(eLbl === 'BC')  dotColor = '#ff6b35';   // orange — climax high
      else if(eLbl === 'SPR') dotColor = '#a78bfa';   // purple — spring
      else if(eLbl === 'UT')  dotColor = '#ffd166';   // gold — upthrust
      else if(isH){
        dotColor = sLbl==='HH' ? '#00e396' :        // green — bullish high
                   sLbl==='LH' ? '#ff4560' :        // red — bearish high
                   '#aaaaaa';                        // grey — equal
      } else {
        dotColor = sLbl==='HL' ? '#00e396' :        // green — bullish low
                   sLbl==='LL' ? '#ff4560' :        // red — bearish low
                   '#aaaaaa';
      }

      // Dot — slightly larger for special events
      const r = eLbl ? 5 : 4;
      pc.beginPath();
      pc.arc(cx, py, r, 0, Math.PI*2);
      pc.fillStyle = dotColor;
      pc.fill();
      // Ring for special events
      if(eLbl){
        pc.beginPath();
        pc.arc(cx, py, r+2, 0, Math.PI*2);
        pc.strokeStyle = dotColor;
        pc.lineWidth = 1;
        pc.stroke();
      }

      // Labels — only when candles are wide enough to avoid clutter
      if(cw >= 4){
        const offset = isH ? -10 : 10;
        pc.textAlign = 'center';

        // Structure label (HH / LH / HL / LL / EH / EL)
        if(sLbl || eLbl){
          const lbl = eLbl || sLbl;
          const lblColor = eLbl ? dotColor :
                           (sLbl==='HH'||sLbl==='HL') ? '#00e396' :
                           (sLbl==='LH'||sLbl==='LL') ? '#ff4560' : '#888';
          pc.fillStyle = lblColor;
          pc.font = 'bold 8px Space Mono';
          pc.fillText(lbl, cx, py + (isH ? offset - 8 : offset + 8));
        }

        // Price
        pc.fillStyle = dotColor;
        pc.font = '8px Space Mono';
        pc.fillText('₹' + piv.price.toFixed(0), cx, py + offset);

        // Swing % — shown slightly further out
        if(swingPct && cw >= 6){
          pc.fillStyle = 'rgba(180,180,180,0.7)';
          pc.font = '7px Space Mono';
          pc.fillText(swingPct+'%', cx, py + (isH ? offset - 17 : offset + 17));
        }
      }
    });
  }
  // ── VOLUME CANVAS ─────────────────────────────────────────
  const vc=vcEl.getContext('2d');
  vc.clearRect(0,0,W,vcEl.height);
  const vH=vcEl.height-PAD.B;
  let maxV=0; vis.forEach(b=>{if(b.volume>maxV)maxV=b.volume;});
  if(maxV===0)maxV=1;

  // grid line
  vc.strokeStyle='rgba(30,45,71,0.55)';vc.lineWidth=1;
  vc.beginPath();vc.moveTo(PAD.L,4);vc.lineTo(W-PAD.R,4);vc.stroke();
  vc.fillStyle='#4a5e7a';vc.font='9px Space Mono';vc.textAlign='right';
  vc.fillText(fmtVol(maxV),PAD.L-4,10);

  vis.forEach((b,i)=>{
    const x=PAD.L+i*(slot);
    const isUp=b.close>=b.open;
    const barH=Math.max(1,(b.volume/maxV)*vH);
    vc.fillStyle=isUp?'rgba(0,227,150,0.65)':'rgba(255,69,96,0.65)';
    vc.fillRect(x,vcEl.height-PAD.B-barH,cw,barH);
  });

  // store for tooltip
  CS._vis=vis;CS._startIdx=startIdx;CS._toY=toY;CS._lo=lo;CS._hi=hi;CS._pH=pH;
}

function renderCharts(allBars, result){
  // clean up old listeners by cloning canvases
  const oldPc=document.getElementById('pc');
  const oldVc=document.getElementById('vc');
  const newPc=oldPc.cloneNode(false);
  const newVc=oldVc.cloneNode(false);
  oldPc.parentNode.replaceChild(newPc,oldPc);
  oldVc.parentNode.replaceChild(newVc,oldVc);

  const bars=filterLast3Years(allBars);
  const sma=calcSMA(bars,20);
  const n=bars.length;

  // size canvases — use full window width for maximum chart space
  const W = Math.max(window.innerWidth || 900, newPc.parentElement.clientWidth || 900);
  newPc.width=W; newPc.height=400;
  newVc.width=W; newVc.height=140;

  // bars is already filtered to the last 3 years by filterLast3Years().
  // Compute cw so ALL n bars fit exactly in the canvas — offset stays at 0.
  // This guarantees the full 3-year window is visible without any scrolling.
  const drawW_init = W - PAD.L - PAD.R;
  const slotF = drawW_init / Math.max(n, 1);   // exact pixels per candle slot
  let cw, gap;
  if(slotF < 2){
    cw = 1; gap = 0;   // pack tight: 1px body, no gap
  } else {
    gap = 1;
    cw  = Math.min(12, Math.max(1, Math.floor(slotF) - gap));
  }
  CS.bars=bars; CS.sma=sma; CS.cw=cw; CS.gap=gap; CS.result=result;
  CS.offset = 0;   // always start from the beginning of the 3-year window

  drawCharts();

  // ── MOUSE DRAG ────────────────────────────────────────────
  newPc.addEventListener('mousedown',e=>{
    CS.dragging=true;CS.dragX=e.clientX;CS.dragOff=CS.offset;
    newPc.style.cursor='grabbing';
  });
  newPc.style.cursor='crosshair';
  window.addEventListener('mouseup',()=>{CS.dragging=false;newPc.style.cursor='crosshair';});
  window.addEventListener('mousemove',e=>{
    if(!CS.dragging)return;
    const dx=e.clientX-CS.dragX;
    const shift=Math.round(-dx/(CS.cw+CS.gap));
    const visC=Math.floor((newPc.width-PAD.L-PAD.R)/(CS.cw+CS.gap));
    CS.offset=Math.max(0,Math.min(CS.dragOff+shift,CS.bars.length-visC));
    drawCharts();
  });

  // ── SCROLL WHEEL ──────────────────────────────────────────
  newPc.addEventListener('wheel',e=>{
    e.preventDefault();
    const visC=Math.floor((newPc.width-PAD.L-PAD.R)/(CS.cw+CS.gap));
    CS.offset=Math.max(0,Math.min(CS.offset+Math.sign(e.deltaY)*5,CS.bars.length-visC));
    drawCharts();
  },{passive:false});

  // ── TOOLTIP ───────────────────────────────────────────────
  const tipEl=document.getElementById('pcTip');
  newPc.addEventListener('mousemove',e=>{
    if(CS.dragging||!CS._vis){if(tipEl)tipEl.style.display='none';return;}
    const rect=newPc.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const i=Math.floor((mx-PAD.L)/(CS.cw+CS.gap));
    const vis=CS._vis;
    if(i<0||i>=vis.length){if(tipEl)tipEl.style.display='none';return;}
    const b=vis[i];
    const isUp=b.close>=b.open;
    if(tipEl){
      tipEl.style.display='block';
      tipEl.innerHTML=`<span style="color:#556080">${b.date}</span><br>
        O <b>${fmtPrice(b.open)}</b>  
        H <b style="color:var(--green)">${fmtPrice(b.high)}</b>  
        L <b style="color:var(--red)">${fmtPrice(b.low)}</b>  
        C <b style="color:${isUp?'var(--green)':'var(--red)'}">${fmtPrice(b.close)}</b><br>
        Vol <b>${fmtVol(b.volume)}</b>`;
    }
    // crosshair line
    drawCharts();
    const cx=PAD.L+i*(CS.cw+CS.gap)+CS.cw/2;
    const pc2=newPc.getContext('2d');
    pc2.strokeStyle='rgba(255,255,255,0.15)';pc2.lineWidth=1;pc2.setLineDash([3,3]);
    pc2.beginPath();pc2.moveTo(cx,PAD.T);pc2.lineTo(cx,newPc.height-PAD.B);pc2.stroke();
    pc2.setLineDash([]);
  });
  newPc.addEventListener('mouseleave',()=>{if(tipEl)tipEl.style.display='none';drawCharts();});

  // ── RESIZE ────────────────────────────────────────────────
  if(!CS.resizeBound){
    CS.resizeBound=true;
    window.addEventListener('resize',()=>{
      const pc3=document.getElementById('pc'),vc3=document.getElementById('vc');
      if(!pc3||!vc3)return;
      const NW=pc3.parentElement.clientWidth||900;
      pc3.width=NW;vc3.width=NW;
      drawCharts();
    });
  }
}

function runAnalysis(){
  if(!rawRows.length){alert('Please upload a file first.');return;}
  document.getElementById('loader').classList.add('show');
  setTimeout(()=>{
    dailyBars=resampleDaily(rawRows);
    if(dailyBars.length<20){
      document.getElementById('loader').classList.remove('show');
      alert(`Only ${dailyBars.length} daily bars after resampling. Need at least 20.`);
      return;
    }
    const result=analyzeWyckoff(dailyBars);
    if(!result || !result.phaseType){
      document.getElementById('loader').classList.remove('show');
      alert('Could not analyse this data. Please check the file format and try again.');
      return;
    }
    renderResults(result,dailyBars);
    document.getElementById('loader').classList.remove('show');
    document.getElementById('uploadSec').style.display='none';
    document.getElementById('resultsSec').classList.add('show');
    window.scrollTo({top:0,behavior:'smooth'});
  },700);
}

function resetApp(){
  rawRows=[];dailyBars=[];
  CS.bars=[];CS.sma=[];CS.offset=0;
  document.getElementById('uploadSec').style.display='';
  document.getElementById('resultsSec').classList.remove('show');
  document.getElementById('out').innerHTML='';
  document.getElementById('fileBar').classList.remove('show');
  document.getElementById('runBtn').classList.remove('show');
  document.getElementById('fi').value='';
}
</script>
